<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Adaptive Learning Support</title>
    <meta name="description" content="Adaptive Learning Support offers specialist SEN support including summer tutoring, ABA home therapy, and parent and LSA workshops." />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta property="og:title" content="Adaptive Learning Support" />
    <meta property="og:description" content="Adaptive Learning Support offers specialist SEN support including summer tutoring, ABA home therapy, and parent and LSA workshops." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adaptivelearningsupport.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Adaptive Learning Support" />
    <meta name="twitter:description" content="Adaptive Learning Support offers specialist SEN support including summer tutoring, ABA home therapy, and parent and LSA workshops." />
    <link rel="icon" type="image/png" href="/als-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!--
      Hidden static forms for Netlify Forms detection.
      Netlify's build bot scans the built HTML for <form data-netlify="true">
      elements to register form handlers (and email notifications). The real
      forms are rendered by React at runtime and submitted via AJAX to "/"
      (see src/lib/netlify-forms.ts) — the field names below must exactly
      match the fields sent from each React form.
    -->
    <div style="display: none" aria-hidden="true">
      <form name="contact-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
      </form>

      <form name="lsa-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="parentName" />
        <input type="text" name="childName" />
        <input type="text" name="childAge" />
        <input type="text" name="diagnosis" />
        <input type="text" name="location" />
        <input type="text" name="phone" />
        <textarea name="description"></textarea>
        <input type="email" name="email" />
      </form>

      <form name="aba-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="parentName" />
        <input type="text" name="childName" />
        <input type="text" name="childAge" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="diagnosis" />
        <input type="text" name="location" />
        <input type="text" name="therapyStatus" />
        <input type="text" name="availability" />
        <textarea name="message"></textarea>
      </form>

      <form name="summer-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="parentName" />
        <input type="text" name="childName" />
        <input type="text" name="childAge" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="schoolYear" />
        <input type="text" name="additionalNeeds" />
        <input type="text" name="preferredStart" />
        <textarea name="message"></textarea>
      </form>

      <form name="workshop-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="role" />
        <input type="text" name="organisation" />
        <input type="text" name="workshopInterest" />
        <input type="text" name="groupSize" />
        <input type="text" name="preferredDate" />
        <textarea name="message"></textarea>
      </form>

      <form name="job-application" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="position" />
        <textarea name="message"></textarea>
        <input type="file" name="cv" />
      </form>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
